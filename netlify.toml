# Configuration Netlify — Costa Verde Aïkido
# Site statique (HTML/CSS/JS) : aucune étape de build.
# Le dossier à publier est la racine du dépôt.

[build]
  publish = "."

# Fonctions serverless (connexion GitHub de l'espace admin)
[functions]
  directory = "netlify/functions"

# --- En-têtes ---------------------------------------------------------------
# Par défaut : sécurité de base, pas de cache agressif sur les pages HTML
# (pour que les mises à jour du site soient visibles tout de suite).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# Images : cache long (1 an). Les fichiers importés via l'admin ont un nom
# unique, et les autres changent rarement.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS / JS : cache long — les pages les appellent avec un numéro de version
# (?v=…) qui change à chaque mise à jour, donc aucun risque de version périmée.
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Données éditées dans l'admin : jamais mises en cache, pour que les
# nouveautés (avis, stages, photos) apparaissent immédiatement.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
