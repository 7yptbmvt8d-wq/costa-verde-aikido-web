# Configuration de l'espace admin (Decap CMS) — Costa Verde Aïkido
# ---------------------------------------------------------------------------
# Authentification via Netlify Identity + Git Gateway (à activer côté Netlify).
# Les modifications faites dans l'admin sont enregistrées dans le dépôt GitHub,
# et le site se redéploie automatiquement.

backend:
  name: github
  repo: 7yptbmvt8d-wq/costa-verde-aikido-web
  branch: claude/google-sites-review-system-rp4tb8
  base_url: https://snazzy-mandazi-e838c7.netlify.app
  auth_endpoint: /.netlify/functions/auth

# Mode brouillon : les modifications restent « En cours » ou « Prêt »
# jusqu'au clic final sur « Publier ». Rien ne part en ligne avant.
publish_mode: editorial_workflow

# Dossier par défaut où sont déposées les photos importées via l'admin
media_folder: "assets/img"
public_folder: "/assets/img"

locale: "fr"

collections:
  # ---------------------------------------------------------- PHOTOS DU SITE
  - name: "photos"
    label: "Photos du site"
    files:
      - name: "site"
        label: "Photos des pages"
        file: "data/site.json"
        description: "Les photos affichées sur les différentes pages du site. Laisse vide pour garder l'emplacement gris."
        fields:
          - { label: "Accueil — photo principale (bandeau)", name: "hero", widget: "image", required: false }
          - { label: "Accueil — photo « Le dojo »", name: "dojo", widget: "image", required: false }
          - { label: "Histoire — photo « La voie »", name: "histoire_voie", widget: "image", required: false }
          - { label: "Histoire — portrait Moriheï Ueshiba", name: "ueshiba", widget: "image", required: false }
          - { label: "Histoire — portrait Nobuyoshi Tamura", name: "tamura", widget: "image", required: false }
  # ---------------------------------------------------------- STAGES
  - name: "stages"
    label: "Stages"
    files:
      - name: "liste"
        label: "Liste des stages"
        file: "data/stages.json"
        description: "Ajoutez, modifiez ou supprimez les stages affichés sur la page Stages."
        fields:
          - label: "Stages"
            name: "stages"
            widget: "list"
            label_singular: "Stage"
            summary: "{{fields.date}} — {{fields.titre}}"
            fields:
              - { label: "Date", name: "date", widget: "string", hint: "Ex. « 15 nov. 2026 » ou « À venir »" }
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  # ---------------------------------------------------------- GALERIE
  - name: "galerie"
    label: "Galerie photos"
    files:
      - name: "saisons"
        label: "Photos par saison"
        file: "data/galerie.json"
        description: "Classez vos photos par saison sportive. Mettez la saison la plus récente en premier."
        fields:
          - label: "Saisons"
            name: "saisons"
            widget: "list"
            label_singular: "Saison"
            summary: "{{fields.titre}}"
            fields:
              - { label: "Titre de la saison", name: "titre", widget: "string", hint: "Ex. « 2025 – 2026 »" }
              - label: "Photos"
                name: "photos"
                widget: "list"
                label_singular: "Photo"
                summary: "{{fields.legende}}"
                fields:
                  - { label: "Image", name: "image", widget: "image", media_folder: "/assets/img/galerie", public_folder: "/assets/img/galerie" }
                  - { label: "Légende", name: "legende", widget: "string", required: false }
